# docker_services/mcp-lab-lb/nginx.conf — C0 step 4: nginx as a round-robin load balancer for two stub MCP replicas.
upstream mcp_replicas {
    # Round-robin by default. Open-source nginx has passive health checking only: a replica is skipped for
    # fail_timeout after max_fails failed requests. Docker healthchecks do not change nginx routing.
    server mcp-replica-1:8000 max_fails=2 fail_timeout=10s;
    server mcp-replica-2:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location /mcp {
        proxy_pass http://mcp_replicas;
        proxy_http_version 1.1;
        # Forward the client's Host (localhost:8001) unchanged, so each replica's allowed_hosts check passes;
        # nginx's default would send the upstream name instead and every request would get 421.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass SSE responses through as they are written instead of buffering them (T1 S117).
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The balancer's own liveness, separate from the replicas' /healthz.
    location = /lb-healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}