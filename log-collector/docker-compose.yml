# Central log collector: copies the stdout/stderr of the infrastructure containers into
# ../../logs/services/<container>/YYYY-MM-DD.log, keeps LOG_RETENTION_DAYS days.
# Reads logs through the Docker API, so it needs the Docker socket (read-only); that is
# root-equivalent access to the Docker host — acceptable for local development only.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  log-collector:
    image: timberio/vector:0.47.0-alpine
    container_name: log-collector
    restart: unless-stopped
    user: "1000:1000"            # files in ~/github/logs/services belong to you, not root
    group_add:
      - "989"                    # gid of /var/run/docker.sock (group docker) — check with: stat -c %g /var/run/docker.sock
    environment:
      LOG_RETENTION_DAYS: "14"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do find /logs -type f -name '*.log' -mtime +$$LOG_RETENTION_DAYS -delete; find /logs -mindepth 1 -type d -empty -delete; sleep 86400; done &
        exec vector --config /etc/vector/vector.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ../../logs/services:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8686/health >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
