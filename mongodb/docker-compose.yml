services:
  mongodb:
#    image: mongo:8.0
    build:
      context: .
      dockerfile: Dockerfile    # ← use custom image
#    deploy:
#      resources:
#        limits:
#          memory: 512m
#          cpus: "0.5"
    container_name: mongodb
    logging:              # Docker keeps at most 3 x 10 MB per container, oldest deleted
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - VAULT_ADDR=http://vault-server:8200    # ← vault-server DNS confirmed ✅
      - VAULT_SECRET_PATH=secret/data/CREDENTIALS
    volumes:
      - mongodb_data:/data/db
      - ./start-mongodb.sh:/start-mongodb.sh
    command: ["bash", "/start-mongodb.sh"]
    secrets:
      - vault_token
    networks:
      - vault-network       # ← join vault-network ✅
      - services_network

  mongo-express:
    build:
      context: .
      dockerfile: Dockerfile-express    # ← use custom image
#    image: mongo-express:latest
    container_name: mongo-express
    logging:              # Docker keeps at most 3 x 10 MB per container, oldest deleted
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      - VAULT_ADDR=http://vault-server:8200    # ← vault-server DNS confirmed ✅
      - VAULT_SECRET_PATH=secret/data/CREDENTIALS
      - ME_CONFIG_BASICAUTH=false
    ports:
      - "127.0.0.1:8081:8081"  # no login (ME_CONFIG_BASICAUTH=false): loopback only
    volumes:
      - ./start-mongo-express.sh:/start-mongo-express.sh
    depends_on:
      - mongodb
    command: ["bash", "/start-mongo-express.sh"]
    secrets:
      - vault_token
    networks:
      - services_network
      - vault-network       # ← join vault-network ✅

secrets:
  vault_token:
    # Value taken from VAULT_TOKEN in the environment of the `docker compose` process; not put in the container env.
    environment: VAULT_TOKEN

volumes:
  mongodb_data:

networks:
  services_network:
    external: true
  vault-network:       # ← join vault-network ✅
    external: true