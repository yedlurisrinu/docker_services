# docker_services/es-mcp-lb/nginx.conf —  nginx as a round-robin load balancer for the es-mcp-server replicas (r1, r2).
upstream es_mcp_backend {
    # Round-robin by default. Open-source nginx has passive health checking only: a replica is skipped for
    # fail_timeout after max_fails failed requests. Docker healthchecks do not change nginx routing.
    zone es_mcp_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server es-mcp-server-r1:8009 resolve max_fails=2 fail_timeout=10s;
    server es-mcp-server-r2:8009 resolve max_fails=2 fail_timeout=10s;
    # Reuse upstream connections (needs proxy_http_version 1.1 and an empty Connection header below).
    keepalive 16;
}

log_format upstream_log '$remote_addr "$request" $status upstream=$upstream_addr';

server {
    listen 9599;
    access_log /var/log/nginx/access.log upstream_log;
    location / {
        proxy_pass http://es_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Forward the client's Host header (es-mcp-lb:9599) unchanged, so each replica's allowed_hosts check passes;
        # nginx's default would send the upstream name instead and every request would get 421.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Fail fast on a dead replica and retry the request on the other one.
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
        # Pass SSE responses through as they are written instead of buffering them.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The balancer's own liveness, separate from the replicas' /healthz.
    location = /lb-healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
