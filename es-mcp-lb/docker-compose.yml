services:
  es-mcp-lb:
    image: nginx:1.30.6-alpine
    container_name: es-mcp-lb
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9599:9599"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9599/lb-healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - services_network

networks:
  services_network:
    external: true