services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile    # ← use custom image
    container_name: redis
    logging:              # Docker keeps at most 3 x 10 MB per container, oldest deleted
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=512        # recommended for Redis
    environment:
      - VAULT_ADDR=http://vault-server:8200    # ← vault-server DNS confirmed ✅
      - VAULT_SECRET_PATH=secret/data/CREDENTIALS
      - vm.overcommit_memory=1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./start-redis.sh:/start-redis.sh
    command: [ "bash", "/start-redis.sh" ]
    secrets:
      - vault_token
    networks:
      - vault-network       # ← join vault-network ✅
      - services_network

  redisinsight:
    image: redis/redisinsight:2.60
    container_name: redisinsight
    logging:              # Docker keeps at most 3 x 10 MB per container, oldest deleted
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    networks:
      - services_network
secrets:
  vault_token:
    # Value taken from VAULT_TOKEN in the environment of the `docker compose` process; not put in the container env.
    environment: VAULT_TOKEN

volumes:
  redis_data:
  redisinsight_data:

networks:
  vault-network:
    external: true
  services_network:
    external: true