# docker_services/news-cimd-host/nginx.conf
# HTTPS server for Client ID Metadata Documents, named news-cimd-host on services_network.
server {
    listen 443 ssl;
    server_name news-cimd-host;

    ssl_certificate     /etc/nginx/tls/news-cimd-host.crt;
    ssl_certificate_key /run/secrets/news_cimd_host_tls_key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # Metadata documents: JSON, cacheable. Keycloak also applies its own minimum cache time (300 s by default),
    # so an edited document can take up to that long to be re-fetched.
    location /clients/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# Health endpoint for the container healthcheck only; bound to loopback, so nothing on the network sees it.
server {
    listen 127.0.0.1:8081;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}