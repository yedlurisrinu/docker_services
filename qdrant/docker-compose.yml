services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    logging:              # Docker keeps at most 3 x 10 MB per container, oldest deleted
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST API, http://localhost:6333/dashboard
      - "127.0.0.1:6334:6334"   # gRPC,
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - services_network

volumes:
  qdrant_data:

networks:
  services_network:
    external: true