services:
  vault-server:
    image: hashicorp/vault:1.21.4
    container_name: vault-server
    logging:              # Docker keeps at most 3 x 10 MB per container, oldest deleted
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      # API on host loopback only; containers use vault-server:8200 over vault-network.
      # No 8201 (cluster) mapping: single node, no HA peers.
      - "127.0.0.1:8200:8200"
    environment:
      - VAULT_ADDR=http://vault-server:8200
    volumes:
      - ./config:/vault/config     # vault.hcl config
      - ./data:/vault/data         # persistent secret storage
      - ./logs:/vault/logs         # logs
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - vault-network

networks:
  vault-network:
    external: true